name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, or vulnerability details. Use the security policy for vulnerabilities.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the smallest useful error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect and why?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the minimal ordered steps and a small non-sensitive example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
      description: Release, commit, or default-branch revision tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant operating system, runtime, and dependency versions.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: This report contains no secret, personal data, or vulnerability details.
          required: true
