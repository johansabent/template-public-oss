name: onboarding

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: onboarding / validate
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository onboarding
        run: python scripts/validate_onboarding.py --root . --repository "$GITHUB_REPOSITORY"
